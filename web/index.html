<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalGraphRAG - Hệ thống Phân tích Pháp lý Việt Nam</title>
    <!-- Premium Fonts: Playfair Display for headings, Inter for UI, JetBrains Mono for data -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i data-lucide="scale"></i>
                <h1>LegalGraphRAG</h1>
            </div>
            <p>Trợ lý phân tích vụ án và pháp lý Việt Nam dựa trên AI & Graph Database</p>
        </header>

        <main>
            <!-- Panel Trái: Nhập liệu -->
            <section class="input-panel solid-panel">
                <h2><i data-lucide="file-pen"></i> Tình tiết vụ án</h2>
                <p class="subtitle">Nhập chi tiết câu chuyện, mâu thuẫn hoặc vụ việc cần phân tích.</p>
                <textarea id="factInput" placeholder="Ví dụ: Ông A vay ông B 100 triệu từ năm 2022, có viết giấy tay hẹn 1 năm trả. Nhưng đến nay không chịu trả, ông B đòi thì bị đánh nhập viện..."></textarea>

                <div class="settings">
                    <div class="setting-group">
                        <label for="topK">Số lượng tham khảo tối đa (Top K):</label>
                        <input type="number" id="topK" value="5" min="1" max="20" style="width: 100%;">
                    </div>
                    <div class="setting-group">
                        <label for="provider">Hệ thống AI (Provider):</label>
                        <select id="provider" style="width: 100%;">
                            <option value="openai">OpenAI (GPT-4o, GPT-4o-mini)</option>
                            <option value="gemini">Google Gemini (Flash, Pro)</option>
                            <option value="deepseek">DeepSeek (V3, R1)</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="apiKey">API Key (Tùy chọn ghi đè cấu hình gốc):</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="password" id="apiKey" placeholder="Nhập API key nếu muốn thay đổi..." style="flex: 1;">
                            <button id="updateKeyBtn" class="secondary-btn" style="padding: 0 16px; border-radius: 8px; cursor: pointer; font-weight: 500;">Lưu cục bộ</button>
                        </div>
                    </div>
                </div>

                <button id="analyzeBtn" class="primary-btn">
                    <span>Phân Tích Pháp Lý</span>
                    <i data-lucide="sparkles"></i>
                </button>
            </section>

            <!-- Panel Phải: Kết quả -->
            <section class="result-panel">
                <!-- Empty State -->
                <div id="emptyState" class="solid-panel empty-state">
                    <i data-lucide="gavel"></i>
                    <p>Kết quả phân tích đa chiều (Nguyên Đơn / Bị Đơn) và Bằng chứng pháp lý sẽ xuất hiện ở đây.</p>
                </div>

                <!-- Loading State (Shimmer) -->
                <div id="loadingState" class="solid-panel shimmer-wrapper hidden">
                    <div class="shimmer shimmer-title"></div>
                    <div class="shimmer shimmer-line w-100"></div>
                    <div class="shimmer shimmer-line w-100"></div>
                    <div class="shimmer shimmer-line w-70"></div>
                    <br>
                    <div class="shimmer shimmer-title" style="width: 30%"></div>
                    <div class="shimmer shimmer-line w-100"></div>
                    <div class="shimmer shimmer-line w-40"></div>
                </div>

                <!-- Analysis Result Container -->
                <div id="analysisResult" class="hidden">
                    <div class="party-tabs" id="partyTabs">
                        <!-- Tabs will be generated here -->
                    </div>

                    <div id="partyContentContainer">
                        <!-- Content will be generated here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Template for Party Content (Hidden) -->
    <template id="partyContentTemplate">
        <div class="party-content">
            <!-- Confidence & Trace -->
            <div class="confidence-badge">
                <i data-lucide="check-circle"></i>
                <span class="confidence-text">Độ tin cậy: --%</span>
            </div>

            <div class="result-card">
                <div class="card-header">
                    <i data-lucide="scale"></i>
                    <h3>Loại Hình Tranh Chấp</h3>
                </div>
                <div class="card-content dispute-type-content"></div>
            </div>

            <div class="result-card">
                <div class="card-header">
                    <i data-lucide="book-open"></i>
                    <h3>Luật Được Áp Dụng</h3>
                </div>
                <div class="card-content tags-container laws-content"></div>
            </div>

            <div class="result-card">
                <div class="card-header">
                    <i data-lucide="file-text"></i>
                    <h3>Bằng Chứng / Tình Tiết Căn Cứ</h3>
                </div>
                <div class="card-content facts-content"></div>
            </div>

            <div class="result-card">
                <div class="card-header">
                    <i data-lucide="lightbulb"></i>
                    <h3>Hướng Giải Quyết & Trách Nhiệm</h3>
                </div>
                <div class="card-content resolution-content"></div>
            </div>

            <div class="trace-log">
                <strong>Nhật ký Hệ thống (Reasoning Trace)</strong>
                <ul class="trace-list"></ul>
            </div>
        </div>
    </template>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
