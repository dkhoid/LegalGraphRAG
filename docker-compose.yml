version: '3.8'

services:
  neo4j:
    image: neo4j:5.14.0
    container_name: legal_graph_neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal_network

  backend:
    build: .
    container_name: legal_graph_backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      # Các biến môi trường khác sẽ được tự động load từ file .env nếu có
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - neo4j
    networks:
      - legal_network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  legal_network:
    driver: bridge
